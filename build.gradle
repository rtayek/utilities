plugins {
	id "java"
  	id "eclipse"
	id "maven-publish"
	id "checkstyle"
	id "pmd"
	id "jacoco"
	id "com.github.spotbugs" version "6.5.10"
}

group = "com.tayek"
version = "0.0"   // set this to whatever you actually want

repositories {
	mavenLocal()
	mavenCentral()
}

java {
	toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

sourceSets {
	main {
		java { srcDirs = ["src"] }
		// Only keep this if you really have top-level "resources/"
		resources { srcDirs = ["resources"] }
	}
	test {
		java { srcDirs = ["tst"] }
		// Only keep this if you really have "tstResources/"
		resources { srcDirs = ["tstResources"] }
	}
}

dependencies {
	implementation "gnu.getopt:java-getopt:1.0.13"
	testImplementation "junit:junit:4.13.2"
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
			artifactId = "tutil"   // stable, regardless of folder name
		}
	}
}

// Quality tools, same versions and configs as chatmap.
// ignoreFailures is true for now: report violations without failing the build.
// Flip each to false once its baseline is clean.

checkstyle {
	toolVersion = "10.18.0"
	configFile = file("config/checkstyle/checkstyle.xml")
	ignoreFailures = true
	showViolations = true
}

pmd {
	toolVersion = "7.26.0"
	consoleOutput = true
	ignoreFailures = true
	ruleSets = []
	ruleSetConfig = resources.text.fromFile("config/pmd/pmd.xml")
}

spotbugs {
	toolVersion = "4.10.3"
	ignoreFailures = true
	excludeFilter = file("config/spotbugs/exclude.xml")
}

jacoco {
	toolVersion = "0.8.15"
}

test {
	finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		xml.required = true
		html.required = true
	}
}

check.dependsOn jacocoTestReport
